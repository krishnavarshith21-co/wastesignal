services:
  - type: web
    name: wastesignal-backend
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm install && npm run build:server
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: AWS_REGION
        value: ap-southeast-2
      - key: AWS_S3_BUCKET
        value: wastesignal-data-683023468572-ap-southeast-2
      - key: GLUE_DATABASE
        value: wastesignal_db
      - key: ATHENA_DATABASE
        value: wastesignal_db
      - key: ATHENA_OUTPUT_LOCATION
        value: s3://wastesignal-data-683023468572-ap-southeast-2/wastesignal/athena-results/
      - key: BEDROCK_MODEL_ID
        value: amazon.nova-micro-v1:0
      - key: CORS_ORIGIN
        value: https://wastesignal.vercel.app
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
